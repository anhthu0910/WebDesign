<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 06 Assignment — Mini House-Price Prediction API</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <!-- <script src="app.js" defer></script> -->
  </head>

  <body>
    <header>
      <h1>Mini House-Price Prediction</h1>
    </header>

    <main>
      <!-- Reads the area, bedrooms, and location values from the form inputs. -->
      <form id="house-form">
        <div> 
          <label for="area">Area (m²):</label>
          <input type="number" id="area" name="area" required />
        </div>
        
        <div> 
          <label for="bedrooms">Bedrooms:</label>
          <input type="number" id="bedrooms" name="bedrooms" required />
        </div>
        
        <div>
          <label for="location">Location:</label>
          <select id="location" name="location" required>
            <option value="other">Other</option>
            <option value="hanoi">Hanoi</option>
            <option value="hcmc">Ho Chi Minh City</option>
          </select>
        </div>        

        <button type="submit"> Predict Price </button>
      </form>

      <div id="result"></div>

      <script>
        document
          .getElementById("house-form")
          .addEventListener("submit", async (event) => {
            event.preventDefault();

            const area = Number(document.getElementById("area").value);
            const bedrooms = Number(document.getElementById("bedrooms").value);
            const location = document.getElementById("location").value;
            const result = document.getElementById("result");

            <!-- Handles the case where the request fails (e.g. shows an error message instead of crashing). -->
            try {
              const query = new URLSearchParams({ area, bedrooms, location });
              const response = await fetch(`/predict?${query}`);

              if (!response.ok) {
                throw new Error(
                  `Request failed with status ${response.status}`,
                );
              }

              const data = await response.json();
              const formattedPrice = new Intl.NumberFormat("en-US").format(
                data.predicted_price,
              );
              result.innerText = `Predicted Price: ${formattedPrice} VND`;
            } catch (error) {
              result.innerText =
                "Unable to predict the price. Please try again.";
              console.error("Prediction request failed:", error);
            }
          });
      </script>
    </main>
  </body>
</html>
